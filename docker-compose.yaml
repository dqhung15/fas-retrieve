services:
  postgres:
    image: postgres:15-alpine
    container_name: ml_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-tracking_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-tracking_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:15-alpine
    container_name: ml_postgres_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin123}
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-tracking_db} -c 'CREATE DATABASE airflow_db;' || true;
      psql -h postgres -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-tracking_db} -c 'CREATE DATABASE mlflow_db;' || true;
      exit 0;
      "

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ml_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API 

  minio:
    image: minio/minio:latest
    container_name: ml_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m
      timeout: 30s
      retries: 5  

  minio-init:
    image: minio/mc:latest
    container_name: ml_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      /usr/bin/mc mb myminio/dataset --ignore-existing &&
      /usr/bin/mc mb myminio/uploads --ignore-existing &&
      /usr/bin/mc mb myminio/checkpoint --ignore-existing &&
      /usr/bin/mc anonymous set download myminio/dataset &&
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: ml_api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-tracking_db}
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET_DATASET=dataset
      - MINIO_BUCKET_UPLOADS=uploads
      - MINIO_BUCKET_CHECKPOINT=checkpoint
    depends_on:
      - postgres
      - qdrant
      - minio
      - minio-init

  ui:
    build:
      context: services/ui
    container_name: ml_ui
    ports:
      - "3000:80"
    depends_on:
      - api

  mlflow:
    image: python:3.10-slim
    container_name: ml_mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123} 
    command: >
      bash -c "pip install mlflow boto3 psycopg2-binary && 
      mlflow server --host 0.0.0.0 
      --port 5000 
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres/mlflow_db 
      --default-artifact-root s3://checkpoint/ 
      --allowed-hosts mlflow,mlflow:5000,localhost,0.0.0.0"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully

  airflow:
    build:
      context: .
      dockerfile: mlops/airflow/Dockerfile
    container_name: ml_airflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres/airflow_db      
      - PYTHONPATH=/opt/airflow
    command: standalone
    depends_on:
      postgres-init:
        condition: service_completed_successfully