services:
  postgres:
    image: postgres:15-alpine
    container_name: ml_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-tracking_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-tracking_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ml_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API 
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
    name: ml_postgres_data
  qdrant_data:
    name: ml_qdrant_data